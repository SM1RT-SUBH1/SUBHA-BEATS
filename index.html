<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Subha Beats — Next-Gen Audio Experience</title>
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Smart Subha Beats" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Subha Beats" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Ultra-HQ YouTube Audio Streaming & Offline Melodies with Background Playback by Smart Subha" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://smartsubhaportfolio.netlify.app/subhajit-sanpui.jpg" />
    <link rel="icon" type="image/jpeg" href="https://smartsubhaportfolio.netlify.app/subhajit-sanpui.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #07090e;
        color: #f1f5f9;
        margin: 0;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Outfit', sans-serif;
      }
      /* Custom glowing scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #090d16;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8b5cf6;
      }
    </style>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#080B10] text-slate-100 antialiased selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
