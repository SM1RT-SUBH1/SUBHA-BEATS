<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Aurora Glow -->
  <circle cx="256" cy="230" r="190" fill="url(#aurora)" />

  <!-- Outer Neon Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.8" />

  <!-- Inner Badge Container -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="#090d16" stroke="#1e293b" stroke-width="4" filter="url(#glow)" />

  <!-- Glowing Musical Note & Sound Waves Graphic -->
  <g transform="translate(136, 110)">
    <!-- Music Notes & Stems -->
    <path d="M70 190 V50 C70 42 76 36 84 34 L180 12 C188 10 196 16 196 24 V170" 
          fill="none" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Connecting Beam -->
    <path d="M70 60 L196 32" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Note Heads -->
    <ellipse cx="45" cy="190" rx="35" ry="26" transform="rotate(-20 45 190)" fill="url(#glowGrad)" />
    <ellipse cx="170" cy="170" rx="35" ry="26" transform="rotate(-20 170 170)" fill="url(#glowGrad)" />

    <!-- Pulse waves on sides -->
    <path d="M215 90 C235 110 235 130 215 150" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M235 75 C265 105 265 145 235 175" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    
    <path d="M25 105 C5 125 5 145 25 165" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">SMART SUBHA</text>
  <text x="256" y="415" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#06b6d4" text-anchor="middle" letter-spacing="6">BEATS</text>

  <!-- Live Status Dot -->
  <circle cx="360" cy="370" r="8" fill="#10b981" />
</svg>
